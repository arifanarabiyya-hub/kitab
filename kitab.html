<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الكتاب التفاعلي</title>
<meta name="theme-color" content="#0f4c45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/app-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Sans:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* الكتاب التفاعلي للتدريس: هو نفسه الكتاب المطبوع صفحةً صفحة (A4 بحواشٍ واسعة)، لكن تمارينه تُحل وتُصحَّح وتُسمع */
:root { --ink: #1d2422; --ink2: #56605d; --line: #d9d2c2; --paper: #fffdf7; --lv: #0f7a6c; --lv-soft: #e3f1ee; --gold: #b48a3c; --gold-soft: #f6ecd6; --tr: #1f5f9e;
  --ok: #1f7a4d; --ok-soft: #e3f2e8; --no: #b3402f; --no-soft: #fbe8e5;
  --f-ui: 'IBM Plex Sans Arabic', Tahoma, sans-serif; --f-book: 'Noto Naskh Arabic', 'Amiri', serif; --f-num: 'IBM Plex Sans', sans-serif;
  /* مقاس الصفحة: A4 (210×297 مم) — الحاشية 64px ≈ 21 مم من كل جهة */
  --W: 640px; --H: 905px; --M: 64px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #3a2d20; font-family: var(--f-ui); color: var(--ink); }
body { overflow: hidden; }
.desk { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 40%, #5a4632 0%, #3a2d20 60%, #241b13 100%); }
button { font: inherit; }
/* شريط الأدوات */
.bar { position: fixed; top: 0; inset-inline: 0; height: 54px; display: flex; gap: 6px; align-items: center; padding: 8px 12px; color: #f3ead8; z-index: 20; background: rgba(20,16,12,.55); backdrop-filter: blur(6px); }
.bar .ttl { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; font-size: .95rem; margin-inline-end: 4px; }
.bar .ttl svg { width: 20px; height: 20px; color: #d8b25c; }
.bar .sp { flex: 1; }
#jumps { display: flex; gap: 5px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
.chip, .tb { flex: none; font-size: .8rem; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.07); color: #f3ead8; border-radius: 99px; padding: 5px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.chip.on, .tb.on { background: #f3ead8; color: #2b2a27; border-color: #f3ead8; }
.tb svg { width: 15px; height: 15px; }
.tb.icon { padding: 5px 8px; }
.tools-g { display: flex; gap: 5px; }
@media (max-width: 1100px) { .bar .ttl span, #jumps { display: none; } .tb .lbl { display: none; } .tb { padding: 6px 9px; } }
.nav { position: fixed; bottom: 10px; inset-inline: 0; display: flex; justify-content: center; align-items: center; gap: 14px; z-index: 20; color: #f3ead8; font-size: .85rem; pointer-events: none; }
.nav > * { pointer-events: auto; }
.nav button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(20,16,12,.6); color: #fff; cursor: pointer; display: grid; place-items: center; }
.nav button:disabled { opacity: .3; }
.nav svg { width: 22px; height: 22px; }
.nav #pg { background: rgba(20,16,12,.6); border-radius: 99px; padding: 6px 12px; }
/* المسرح */
.stagewrap { position: fixed; inset: 54px 0 0; overflow: hidden; perspective: 2600px; }
.book { position: absolute; left: 50%; top: 50%; width: calc(var(--W) * 2); height: var(--H); transform-origin: center; transform-style: preserve-3d; }
.half { position: absolute; top: 0; width: var(--W); height: var(--H); }
.half.r { right: 0; } .half.l { left: 0; }
.spine { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: rgba(0,0,0,.25); z-index: 2; }
.leaf { position: absolute; top: 0; width: var(--W); height: var(--H); transform-style: preserve-3d; z-index: 4; transition: transform .9s cubic-bezier(.45,.05,.3,1); }
.leaf .face { position: absolute; inset: 0; backface-visibility: hidden; }
.leaf .back { transform: rotateY(180deg); }
/* وضع الصفحة الواحدة: الصفحة بعرض الشاشة مع تمرير عمودي */
.stagewrap.one { overflow: auto; overscroll-behavior: contain; }
.stagewrap.one .book { position: relative; left: auto; top: auto; width: var(--W); transform: none !important; margin: 14px auto 80px; }
.stagewrap.one .half { position: relative; }

/* ---------- الصفحة ---------- */
.page { width: var(--W); height: var(--H); background: var(--paper); position: relative; overflow: hidden; padding: var(--M); font-size: 11.4px; line-height: 1.55; }
.half.r .page { box-shadow: inset 18px 0 22px -16px rgba(0,0,0,.28), 0 14px 30px rgba(0,0,0,.45); }
.half.l .page { box-shadow: inset -18px 0 22px -16px rgba(0,0,0,.28), 0 14px 30px rgba(0,0,0,.45); }
.one .page { box-shadow: 0 14px 30px rgba(0,0,0,.45); }
.empty { background: transparent !important; box-shadow: none !important; }
.run { position: absolute; top: 28px; inset-inline: var(--M); display: flex; justify-content: space-between; font-size: 8.8px; color: var(--ink2); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.folio { position: absolute; bottom: 26px; inset-inline: 0; text-align: center; font-family: var(--f-num); font-size: 9.5px; color: var(--ink2); }
.lhead { display: flex; align-items: center; gap: 8px; background: var(--lv); color: #fff; border-radius: 8px; padding: 7px 11px; margin-bottom: 9px; }
.lhead .n { background: #fff; color: var(--lv); font-family: var(--f-num); font-weight: 700; border-radius: 6px; padding: 0 7px; font-size: 12px; }
.lhead h1 { margin: 0; font-size: 18px; font-family: var(--f-book); }
.lhead .trt { margin-inline-start: auto; font-family: var(--f-num); font-size: 9.5px; opacity: .9; direction: ltr; }
.sec { display: flex; align-items: center; gap: 6px; margin: 7px 0 4px; color: var(--lv); font-weight: 700; font-size: 12px; }
.sec .ic { width: 21px; height: 21px; border-radius: 6px; background: var(--lv); color: #fff; display: grid; place-items: center; flex: none; }
.sec .ic svg { width: 12px; height: 12px; }
.sec > .tr { margin-inline-start: auto; font-weight: 400; }
.tr { font-family: var(--f-num); font-size: 8.4px; color: var(--tr); direction: ltr; unicode-bidi: isolate; }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff; position: relative; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; } .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; } .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } .g5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
/* بطاقات المفردات: كلها بالمقاس نفسه، وسطر الجمع محجوز دائماً */
.vgs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.vg h4 { margin: 0 0 3px; font-size: 9.6px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vg .col { display: grid; grid-template-rows: repeat(4, 1fr); gap: 5px; }
.v { border: 1px solid var(--line); border-radius: 8px; padding: 4px 4px 3px; text-align: center; background: #fff; height: 84px; display: grid; grid-template-rows: 38px 1fr 10px 10px; align-items: center; justify-items: center; overflow: hidden; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.v:hover { border-color: var(--lv); box-shadow: 0 0 0 2px var(--lv-soft); }
.v.playing { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
.pic { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; display: block; }
.pic.emo { display: grid; place-items: center; font-size: 26px; }
.v .a { font-family: var(--f-book); font-size: 12.2px; line-height: 1.35; font-weight: 600; }
.v .pl { font-family: var(--f-book); font-size: 9px; color: var(--ink2); line-height: 1; }
.v .tr { font-size: 8.4px; line-height: 1; }
.v.sm { height: 78px; grid-template-rows: 38px 1fr 10px; } .v.sm .pic { width: 38px; height: 38px; }
.ph { display: flex; flex-direction: column; gap: 0; background: var(--gold-soft); border-radius: 6px; padding: 2px 8px; cursor: pointer; } .ph .tr { align-self: flex-end; line-height: 1.1; }
.ph .a { font-family: var(--f-book); font-size: 12.2px; font-weight: 600; }
.obj { background: var(--lv-soft); border-radius: 8px; padding: 5px 9px; margin-bottom: 4px; }
.obj ol { margin: 0; padding-inline-start: 16px; columns: 2; column-gap: 16px; font-size: 9.8px; }
.dl { display: grid; gap: 3px; }
.dl .ln { display: grid; grid-template-columns: 56px auto 1fr; gap: 6px; align-items: baseline; cursor: pointer; border-radius: 5px; padding: 0 4px; }
.dl .ln:hover { background: var(--lv-soft); }
.dl .ln.playing { background: var(--gold-soft); }
.dl .ln .tr { text-align: left; align-self: center; font-size: 8.4px; }
.exh .tr { margin-inline-start: 6px; }
.dl .sp { font-weight: 700; color: var(--lv); font-size: 9.8px; }
.dl .ln.k .sp { color: var(--gold); }
.dl .t { font-family: var(--f-book); font-size: 12.4px; line-height: 1.55; }
.q { font-family: var(--f-book); font-size: 11.8px; }
.opts { display: flex; gap: 4px 10px; flex-wrap: wrap; font-family: var(--f-book); font-size: 11.2px; }
.rule li { margin-bottom: 2px; }
table.gt { width: 100%; border-collapse: collapse; font-family: var(--f-book); font-size: 11.6px; }
table.gt th, table.gt td { border: 1px solid var(--line); padding: 1px 6px; text-align: center; }
table.gt th { background: var(--lv-soft); font-family: var(--f-ui); font-size: 9.2px; }
.trnote { background: #eef4fa; border: 1px solid #c8d8e8; border-radius: 7px; padding: 4px 8px; font-family: var(--f-num); font-size: 8.6px; color: #1f4f7e; direction: ltr; text-align: left; }
.trnote [lang=ar] { font-family: var(--f-book); direction: rtl; unicode-bidi: isolate; font-size: 10px; }
.sh { border: 1px solid #e3cf9e; background: #fdf8ec; border-radius: 7px; padding: 4px 7px; }
.sh .k { font-size: 8.4px; color: var(--gold); font-weight: 700; }
.sh .t { font-family: 'Amiri', var(--f-book); font-size: 12.2px; line-height: 1.35; }
.sh .m { color: #1f5f9e; border-bottom: 1.5px solid #1f5f9e; } .sh .s { color: #8a2d3b; border-bottom: 1.5px solid #8a2d3b; font-weight: 700; }
.sh .src { font-size: 8.4px; color: var(--ink2); }
.sh .f { font-size: 8.6px; color: #1f7a4d; display: flex; gap: 3px; align-items: baseline; }
.sh .f svg, .mini svg { width: 9px; height: 9px; flex: none; }
.role { border: 1.5px dashed var(--lv); border-radius: 8px; padding: 5px 8px; font-size: 9.8px; }
.role b { color: var(--lv); }
.read { font-family: var(--f-book); font-size: 12.4px; line-height: 1.9; text-align: justify; }
.form { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.form label { display: grid; font-size: 8.6px; color: var(--ink2); }
.quiz { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center; background: #0d2b28; color: #fff; border-radius: 9px; padding: 8px 12px; }
.qr { width: 74px; height: 74px; background: #fff; border-radius: 5px; padding: 5px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.qr i { background: #111; border-radius: 1px; } .qr i.o { background: #fff; }
.qbtn { background: #d8b25c; color: #1d2422; border: 0; border-radius: 99px; padding: 6px 14px; font-weight: 700; font-size: 10.5px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.athar { text-align: center; border-top: 1px solid var(--line); margin-top: 7px; padding-top: 5px; font-family: 'Amiri', var(--f-book); font-size: 12.4px; }
.skills { display: flex; gap: 3px; }
.skills span { font-size: 8.4px; color: #fff; border-radius: 99px; padding: 0 6px; font-weight: 400; }
.toc td { padding: 6px 4px; border-bottom: 1px solid #eee7d8; vertical-align: top; font-size: 9.8px; }
.toc .u { font-weight: 700; color: var(--lv); white-space: nowrap; }
.toc .p { font-family: var(--f-num); color: var(--ink2); text-align: left; }
.cover { padding: 0; background: #0f4c45; color: #f3e7cc; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.cover .frame { position: absolute; inset: 30px; border: 3px solid #c9a24a; border-radius: 4px; }
.cover .frame::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(201,162,74,.6); }
.cover h1 { font-family: 'Amiri', serif; font-size: 64px; margin: 0; line-height: 1.2; }
.cover h2 { font-family: 'Amiri', serif; font-size: 30px; margin: 2px 0 28px; font-weight: 400; }
.star { width: 130px; height: 130px; position: relative; margin: 6px 0 22px; }
.star::before, .star::after { content: ""; position: absolute; inset: 20px; border: 3px solid #c9a24a; }
.star::after { transform: rotate(45deg); }
.star span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: 32px; }
.icons-legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.icons-legend div { display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; font-size: 9.8px; }
.icons-legend .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; flex: none; }
.icons-legend svg { width: 13px; height: 13px; }
.rev td { border: 1px solid var(--line); padding: 1px 5px; font-size: 10px; vertical-align: middle; }
.rev .a { font-family: var(--f-book); font-size: 12.2px; font-weight: 600; }
.rev .pic { width: 20px; height: 20px; border-radius: 4px; } .rev .pic.emo { font-size: 15px; }
.eqh { align-items: stretch; } .eqh > * { height: 100%; }
.eqh > div:not(.box):not(.role):not(.sh) { display: flex; flex-direction: column; }
.eqh > div:not(.box):not(.role):not(.sh) > .box:last-child { flex: 1; }

/* ---------- عناصر التفاعل (تبدو على الورق كما في الطبعة) ---------- */
.tr { visibility: hidden; }
.trall .tr, .tron .tr, .lhead .tr, .cover .tr { visibility: visible; }
.exh { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
.exh b { font-size: 9.8px; }
.ctl { margin-inline-start: auto; display: flex; gap: 3px; }
.ctl button, .say { border: 1px solid var(--line); background: #fff; color: var(--ink2); border-radius: 99px; height: 19px; min-width: 19px; padding: 0 6px; font-size: 8.4px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; line-height: 1; }
.ctl button svg, .say svg { width: 10px; height: 10px; }
.ctl button:hover, .say:hover { border-color: var(--lv); color: var(--lv); }
.ctl button.on { background: var(--lv); color: #fff; border-color: var(--lv); }
.sec .ctl button { font-weight: 400; }
.say { color: var(--lv); vertical-align: middle; }
.say.playing { background: var(--gold); color: #fff; border-color: var(--gold); }
.opt { border: 0; background: none; padding: 1px 3px; font-family: var(--f-book); font-size: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; border-radius: 5px; }
.opt::before { content: ""; width: 10px; height: 10px; border: 1px solid var(--ink2); border-radius: 2px; flex: none; background: #fff; }
.opt:hover { background: var(--lv-soft); }
.opt.sel::before { background: var(--ink); box-shadow: inset 0 0 0 2px #fff; }
.opt.good { background: var(--ok-soft); color: var(--ok); } .opt.good::before { background: var(--ok); border-color: var(--ok); }
.opt.bad { background: var(--no-soft); color: var(--no); } .opt.bad::before { background: var(--no); border-color: var(--no); }
.show .opt.k, .allans .opt.k { outline: 1.5px solid var(--ok); outline-offset: -1px; }
.tfrow { display: flex; align-items: baseline; gap: 4px; }
.tfrow .grp { display: inline-flex; gap: 0; flex: none; }
.tfrow .opt { font-family: var(--f-ui); font-size: 8.6px; padding: 1px 2px; }
.inp { border: 0; border-bottom: 1px dotted var(--ink2); background: transparent; font-family: var(--f-book); font-size: 11.6px; color: var(--ink); padding: 0 2px; min-width: 40px; outline: none; }
.inp:focus { border-bottom: 1.5px solid var(--lv); background: var(--lv-soft); }
.inp.good { border-bottom-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.inp.bad { border-bottom-color: var(--no); color: var(--no); background: var(--no-soft); }
.inp.full { width: 100%; display: block; }
textarea.inp { resize: none; width: 100%; height: 38px; line-height: 19px; background-image: repeating-linear-gradient(transparent 0 18px, #c9c2b3 18px 19px); border-bottom: 0; }
.key, .why { display: none; font-family: var(--f-book); font-size: 10px; color: var(--ok); }
.kw { position: relative; display: inline-block; } .kw.full { display: block; }
.kw > .key { position: absolute; bottom: 92%; inset-inline-start: 0; background: var(--ok-soft); border: 1px solid #b9dcc6; padding: 0 4px; border-radius: 4px; white-space: nowrap; pointer-events: none; z-index: 3; line-height: 1.45; }
.show .key, .allans .key { display: inline; }
.why { color: #6b5a2c; font-family: var(--f-ui); font-size: 8.6px; }
.done .why, .show .why, .allans .why { display: block; }
.ord .oi { display: flex; gap: 5px; align-items: baseline; cursor: pointer; border-radius: 5px; padding: 0 3px; }
.ord .oi:hover { background: var(--lv-soft); }
.ord .num { width: 13px; height: 13px; border: 1px solid var(--ink2); border-radius: 2px; flex: none; font-family: var(--f-num); font-size: 8.5px; display: grid; place-items: center; }
.ord.good .num { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); } .ord.bad .num { border-color: var(--no); color: var(--no); }
.match { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 3px; }
.mp { border: 1px solid var(--line); border-radius: 6px; padding: 2px; cursor: pointer; display: grid; justify-items: center; gap: 1px; background: #fff; }
.mp .pic { width: 100%; height: 30px; }
.mp .pic.emo { font-size: 20px; }
.mp .lab { font-family: var(--f-book); font-size: 10px; min-height: 14px; border-top: 1px dotted var(--ink2); width: 100%; text-align: center; }
.mp.cur { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
.mp.good { border-color: var(--ok); } .mp.good .lab { color: var(--ok); } .mp.bad { border-color: var(--no); } .mp.bad .lab { color: var(--no); }
.mw { border: 1px dashed var(--ink2); background: #fff; border-radius: 99px; padding: 0 8px; font-family: var(--f-book); font-size: 11px; cursor: pointer; }
.mw.used { opacity: .4; }
.mkey { display: none; font-size: 8.6px; color: var(--ok); }
.show .mkey, .allans .mkey { display: block; }
.ex .q { font-size: 11px; line-height: 1.45; } .ex .opts { font-size: 10.6px; gap: 2px 8px; } .ex .inp { font-size: 11px; }
.score { position: absolute; top: 6px; inset-inline-end: 8px; font-family: var(--f-num); font-size: 8.4px; color: var(--ok); }

/* تنبيه */
.toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%) translateY(20px); background: #0d2b28; color: #fff; padding: 9px 18px; border-radius: 99px; font-size: .85rem; opacity: 0; transition: .25s; z-index: 50; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%); }

/* ---------- الهاتف: الصفحة نفسها بانسياب حر وخط مقروء ---------- */
@media (max-width: 700px) {
  .stagewrap.one .book { width: 100%; margin: 6px 0 84px; }
  .stagewrap.one .half { width: 100%; height: auto; }
  .stagewrap.one .page { width: calc((100vw - 8px) / 1.32); zoom: 1.32; height: auto; overflow: visible; padding: 34px 12px 40px; margin: 0 auto; }
  .stagewrap.one .page.cover { min-height: 600px; }
  .stagewrap.one .run { inset-inline: 12px; top: 10px; }
  .stagewrap.one .folio { bottom: 12px; }
  .stagewrap.one .vgs, .stagewrap.one .g4, .stagewrap.one .g5, .stagewrap.one .form, .stagewrap.one .match, .stagewrap.one .icons-legend { grid-template-columns: repeat(2, 1fr); }
  .stagewrap.one .g3, .stagewrap.one .g2 { grid-template-columns: 1fr; }
  .stagewrap.one .vg .col { grid-template-rows: none; }
  .stagewrap.one .obj ol { columns: 1; }
  .stagewrap.one .dl .ln { grid-template-columns: 50px 1fr; } .stagewrap.one .dl .ln .tr { grid-column: 2; text-align: right; }
  .stagewrap.one .ctl button, .stagewrap.one .say { height: 26px; min-width: 26px; }
  .stagewrap.one .quiz { grid-template-columns: 1fr auto; } .stagewrap.one .qr { display: none; }
  .stagewrap.one .toc td:last-child { display: none; }
}
@media (max-width: 400px) { #tFull, #tIn, #tOut { display: none; } .tb { padding: 6px 7px; } }

/* أدوات المعلم */
const tog = (btn, cls) => { const on = document.body.classList.toggle(cls); btn.classList.toggle('on', on); return on; };
$id('tTr').onclick = e => tog(e.currentTarget, 'trall');
$id('tAns').onclick = e => { const on = tog(e.currentTarget, 'allans'); e.currentTarget.querySelector('.lbl').textContent = on ? 'إخفاء الإجابات' : 'الإجابات'; };
$id('tView').onclick = () => { if (phone()) { toast('على الهاتف تُعرض صفحة واحدة'); return; } mode = (mode || autoMode()) === 'two' ? 'one' : 'two'; userZ = 1; render(); };
$id('tIn').onclick = () => { userZ = Math.min(2.2, userZ + .15); fit(); };
$id('tOut').onclick = () => { userZ = Math.max(.5, userZ - .15); fit(); };
$id('tFull').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} };
$id('tReset').onclick = () => { if (!confirm('مسح كل الإجابات المكتوبة في هذا الجهاز؟')) return; Object.keys(S).forEach(k => delete S[k]); save(); all(); toast('مُسحت الإجابات'); };
$id('tPrint').onclick = () => { const pr = $id('printroot'); pr.innerHTML = P.join(''); apply(pr); setTimeout(() => print(), 300); };
let lastMode = autoMode(); addEventListener('resize', () => { if (!mode && autoMode() !== lastMode) { lastMode = autoMode(); render(); } else fit(); });
/* تطبيق قابل للتثبيت (حين يُستضاف الموقع مستقلاً) */
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
render(); (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => render());
</script>
</body>
</html>

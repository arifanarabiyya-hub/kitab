<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسابقة الدرس — المعلم</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&family=IBM+Plex+Sans:wght@400;700;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz.css">
</head>
<body class="pattern">
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../audio/manifest.js"></script>
<script src="engine.js"></script>
<script src="quizzes.js"></script>
<script src="client.js"></script>
<script>
(async () => {
  const tr = new QuizUI.ServerTransport();
  const info = await tr.info();
  if (!info) { location.replace('demo.html'); return; } // لا يوجد خادم: انتقل إلى العرض التجريبي
  QuizUI.HostApp(document.getElementById('app'), tr, { joinUrl: info.joinUrl });
})();
</script>
</body>
</html>
